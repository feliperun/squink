name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test --summary all
      - name: cross-compile release targets
        run: |
          for t in x86_64-linux aarch64-linux arm-linux-musleabihf riscv64-linux; do
            zig build --release -Dtarget=$t --prefix out/$t
          done
          ls -l out/*/bin/squink
